# RE-ENABLED 2026-07-28: this project deploys on Render (the Hetzner runbook was for a different
# project). A push to the connected branch auto-deploys.
# Render Blueprint — one web service that builds the frontend and runs the relay server.
# The server serves the built app AND the Socket.IO relay on the same origin, so real-time
# sync works with zero extra config. Deploys automatically on every push to the repo.
services:
  - type: web
    name: frendz-and-foes
    env: node
    plan: free
    # --include=dev is required: Render sets NODE_ENV=production, which would otherwise skip
    # the build tools (vite, tailwind) needed to build the frontend.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      # Render is the OWNER'S TESTING environment and is deliberately UNLOCKED, so the games are
      # playable there while the public Hetzner box (playzoo.snapaweb.com) stays shut until the
      # Kickstarter completes.
      #
      # This only affects Render. The Hetzner box reads its own environment from a systemd drop-in
      # and never looks at this file, so unlocking here cannot unlock production. To open the
      # public site on launch day, set GAMES_OPEN=true THERE - do not rely on this line.
      - key: GAMES_OPEN
        value: "true"
